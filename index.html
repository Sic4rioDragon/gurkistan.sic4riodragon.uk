<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gurkistanischer Internetschein</title>

  <link rel="icon" type="image/png" href="https://sic4riodragon.uk/assets/SicarioDragon.png" />
  <link rel="shortcut icon" href="https://sic4riodragon.uk/assets/SicarioDragon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="title-block">
        <h1>Gurkistanischer Internetschein</h1>
        <p class="subtext">
          Daten eintragen, Profilbild hochladen und den eigenen Internetschein als PNG herunterladen.
        </p>
        <a class="about-link" href="/about/">Über das Projekt</a>
      </div>

     <select id="versionSelect">
    <option value="gurkistan_licence_1">Gurkistan Lizenz 1</option>
    <option value="gurkistan_licence_2">Gurkistan Lizenz 2</option>
    </select>

      <form class="form" id="cardForm">
        <div class="field">
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" value="Gurke Gurkensen" maxlength="32" />
        </div>

        <div class="field">
          <label for="addressInput">Adresse</label>
          <input id="addressInput" type="text" value="Gurkistan" maxlength="40" />
        </div>

        <div class="field birthday-field">
          <label>Geburtstag</label>

          <input id="birthdayInput" type="hidden" value="01.01.2000" />

          <div class="birthday-selects">
            <select id="birthdayDay" aria-label="Geburtstag Tag"></select>
            <select id="birthdayMonth" aria-label="Geburtstag Monat"></select>
            <select id="birthdayYear" aria-label="Geburtstag Jahr"></select>
          </div>
        </div>

        <div class="field">
          <label for="expiresInput">Gültig bis</label>
          <input id="expiresInput" type="text" value="01.01.2099" maxlength="20" />
        </div>

        <div class="field">
          <label for="sexInput">Sex</label>
          <input id="sexInput" type="text" value="Internet" maxlength="18" />
        </div>

        <div class="field">
          <label for="hairInput">Hair</label>
          <input id="hairInput" type="text" value="Gurke" maxlength="18" />
        </div>

        <div class="field">
          <label for="eyesInput">Eyes</label>
          <input id="eyesInput" type="text" value="Online" maxlength="18" />
        </div>

        <div class="field">
          <label for="signatureInput">Signatur</label>
          <input id="signatureInput" type="text" value="G. Gurkensen" maxlength="28" />
        </div>

        <div class="field file-field">
          <label for="photoInput">Profilbild</label>
          <input id="photoInput" type="file" accept="image/*" />
        </div>

        <div class="field photo-controls">
          <label>Profilbild anpassen</label>

          <div class="range-field">
            <span>Zoom</span>
            <input id="photoZoomInput" type="range" min="0.3" max="3" step="0.01" value="1" />
          </div>

          <div class="range-field">
            <span>X</span>
            <input id="photoOffsetXInput" type="range" min="-180" max="180" step="1" value="0" />
          </div>

          <div class="range-field">
            <span>Y</span>
            <input id="photoOffsetYInput" type="range" min="-180" max="180" step="1" value="0" />
          </div>

          <button type="button" class="small-secondary" id="resetPhotoBtn">
            Bildposition zurücksetzen
          </button>
        </div>

        <div class="buttons">
          <button type="button" id="downloadBtn">PNG herunterladen</button>
          <button type="button" class="secondary" id="resetBtn">Zurücksetzen</button>
        </div>
      </form>

    </section>

    <section class="preview-wrap">
      <canvas id="cardCanvas" width="780" height="500"></canvas>
    </section>
  </main>

  <span class="font-preload">GURKISTANISCHER FÜHRERSCHEIN 01.01.2099</span>

  <script src="app.js"></script>
</body>
</html>
